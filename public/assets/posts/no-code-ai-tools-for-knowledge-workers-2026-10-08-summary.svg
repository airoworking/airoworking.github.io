<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t2"><title id="t2">직장인·지식근로자에게 No-Code AI Tools 실전 활용 가이드 핵심 요약</title><rect width="1200" height="780" rx="28" fill="#f7f7f5"/><text x="60" y="72" font-family="system-ui,sans-serif" font-size="34" font-weight="850" fill="#111111">핵심 요약</text><text x="60" y="112" font-family="system-ui,sans-serif" font-size="19" fill="#666666">본문의 검증된 내용을 빠르게 훑기 위한 자동 생성 인포그래픽</text><rect x="60" y="150" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="174" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="207" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">01</text><text x="158" y="193" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">1. 직장인 및 지식근로자에게 AI 도구를 처음 도입할 때</text><text x="158" y="232" font-family="system-ui,sans-serif" font-size="20" fill="#555555">AI 도구를 처음 도입할 때는 업무 유형과 목표를 명확히 파악해야 합니다.</text><rect x="60" y="300" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="324" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="357" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">02</text><text x="158" y="343" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">2. 업무 유형별 AI 도구 선택 기준</text><text x="158" y="382" font-family="system-ui,sans-serif" font-size="20" fill="#555555">리서치는 ChatGPT, Claude, Gemini 등 생성형 AI 도구를 사용하는 것이 적절합니다.</text><rect x="60" y="450" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="474" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="507" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">03</text><text x="158" y="493" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">3. AI 도구 활용 시 가장 중요한 고려 사항</text><text x="158" y="532" font-family="system-ui,sans-serif" font-size="20" fill="#555555">프롬프트는 역할 지정, 맥락 제공, 출력 형식 지정이 필요합니다.</text><rect x="60" y="600" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="624" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="657" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">04</text><text x="158" y="643" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">4. AI 도구 활용 사례</text><text x="158" y="682" font-family="system-ui,sans-serif" font-size="20" fill="#555555">리서치는 ChatGPT, Claude, Gemini 등 생성형 AI 도구를 사용하여 정보를 자동화합니다.</text><text x="60" y="748" font-family="system-ui,sans-serif" font-size="16" fill="#8a8a86">AI로 일하는 법 · final fact-checked article</text></svg>