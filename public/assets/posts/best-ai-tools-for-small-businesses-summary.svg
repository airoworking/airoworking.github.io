<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t2"><title id="t2">소규모 사업자가 AI 도구를 선택할 때 실전 활용 가이드 핵심 요약</title><rect width="1200" height="780" rx="28" fill="#f7f7f5"/><text x="60" y="72" font-family="system-ui,sans-serif" font-size="34" font-weight="850" fill="#111111">핵심 요약</text><text x="60" y="112" font-family="system-ui,sans-serif" font-size="19" fill="#666666">본문의 검증된 내용을 빠르게 훑기 위한 자동 생성 인포그래픽</text><rect x="60" y="150" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="174" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="207" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">01</text><text x="158" y="193" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">소규모 사업자가 AI 도구를 선택할 때 가장 중요한 고려 </text><text x="158" y="232" font-family="system-ui,sans-serif" font-size="20" fill="#555555">기능, 가격, 사용 용도를 고려해야 합니다.</text><rect x="60" y="300" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="324" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="357" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">02</text><text x="158" y="343" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">AI 도구의 가격 대비 가치 평가 방법</text><text x="158" y="382" font-family="system-ui,sans-serif" font-size="20" fill="#555555">기능, 사용 용도, 시간 및 비용 절감의 정도를 고려해야 합니다.</text><rect x="60" y="450" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="474" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="507" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">03</text><text x="158" y="493" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">소규모 사업자가 AI 도구를 실제 업무에 적용할 때 가장 </text><text x="158" y="532" font-family="system-ui,sans-serif" font-size="20" fill="#555555">도구의 사용 용도와 기능을 파악해야 합니다.</text><rect x="60" y="600" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="624" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="657" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">04</text><text x="158" y="643" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">AI 도구의 사용 용도에 따라 선택할 때 고려해야 할 기준</text><text x="158" y="682" font-family="system-ui,sans-serif" font-size="20" fill="#555555">도구의 사용 용도와 기능을 파악해야 합니다.</text><text x="60" y="748" font-family="system-ui,sans-serif" font-size="16" fill="#8a8a86">AI로 일하는 법 · final fact-checked article</text></svg>