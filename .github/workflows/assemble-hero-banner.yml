name: Assemble HQ Hero Banner
on:
  push:
    branches:
      - replace-hero-hq-static
    paths:
      - 'hero-upload/READY'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static high-quality banner
        run: |
          cat hero-upload/part*.b64 | tr -d '\n\r' | base64 --decode > assets/brand/hero-banner-2048.avif
          cp assets/brand/hero-banner-2048.avif assets/brand/hero-banner.avif
          test "$(stat -c%s assets/brand/hero-banner-2048.avif)" -gt 90000
      - name: Commit banner assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/hero-banner-2048.avif assets/brand/hero-banner.avif
          git commit -m "Replace hero with high-quality static banner"
          git push
