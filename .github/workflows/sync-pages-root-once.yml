name: One-time Pages root mirror sync
on:
  push:
    branches: [fix/pages-single-visual-output]
    paths:
      - '.github/workflows/sync-pages-root-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Zero-cost public-repository guard
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Refusing to run in a private repository."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: fix/pages-single-visual-output
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror public site to repository root
        run: |
          node scripts/sync-pages-root.mjs
          node scripts/sync-pages-root.mjs --check
      - name: Commit mirror only
        run: |
          git config user.name "pages-mirror[bot]"
          git config user.email "pages-mirror[bot]@users.noreply.github.com"
          git add .nojekyll .pages-mirror-files.json
          node -e "for (const f of JSON.parse(require('fs').readFileSync('.pages-mirror-files.json','utf8'))) console.log(f)" | while IFS= read -r file; do git add -- "$file"; done
          git commit -m "fix: mirror public site at Pages root"
          git push origin HEAD:fix/pages-single-visual-output
