name: One-time AdSense site loader apply
on:
  push:
    branches: [feat/adsense-site-verification]
    paths:
      - '.github/workflows/apply-adsense-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Zero-cost public-repository guard
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Refusing to run in a private repository."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: feat/adsense-site-verification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply AdSense and synchronize Pages outputs
        run: |
          node scripts/apply-adsense.mjs
          node scripts/apply-adsense.mjs --check
          node scripts/sync-pages-root.mjs
          node scripts/sync-pages-root.mjs --check
      - name: Commit generated site files
        run: |
          git config user.name "adsense-setup[bot]"
          git config user.email "adsense-setup[bot]@users.noreply.github.com"
          git add public .nojekyll .pages-mirror-files.json
          node -e "for (const f of JSON.parse(require('fs').readFileSync('.pages-mirror-files.json','utf8'))) console.log(f)" | while IFS= read -r file; do git add -- "$file"; done
          if git diff --cached --quiet; then
            echo "No site changes."
            exit 0
          fi
          git commit -m "feat: apply AdSense site loader"
          git push origin HEAD:feat/adsense-site-verification
