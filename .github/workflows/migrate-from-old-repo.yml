name: One-time repository migration

on:
  push:
    branches: [migration/full-site]
    paths:
      - '.github/workflows/migrate-from-old-repo.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Zero-cost public-repository guard
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Refusing to run in a private repository."
            exit 1
          fi

      - name: Checkout destination
        uses: actions/checkout@v6
        with:
          ref: migration/full-site
          fetch-depth: 0

      - name: Clone existing public blog
        run: |
          git clone --depth 1 https://github.com/yunjinyong730/Profitable-Blog-Automation.git /tmp/source-blog

      - name: Copy complete repository contents except workflows
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/source-blog/ ./

      - name: Rebase site identity and URLs
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          old_site = 'https://yunjinyong730.github.io/Profitable-Blog-Automation'
          new_site = 'https://airoworking.github.io'
          old_repo = 'https://github.com/yunjinyong730/Profitable-Blog-Automation'
          new_repo = 'https://github.com/airoworking/airoworking.github.io'
          old_brand = 'Practical AI & Automation'
          new_brand = 'AI로 일하는 법'

          replacements = [
              (old_site + '/', new_site + '/'),
              (old_site, new_site),
              (old_repo, new_repo),
              (old_brand, new_brand),
              ('Practical AI &amp; Automation', 'AI로 일하는 법'),
          ]

          skip_dirs = {'.git', 'node_modules', 'workflows'}
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_bytes().decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              changed = text
              for old, new in replacements:
                  changed = changed.replace(old, new)
              if changed != text:
                  path.write_text(changed, encoding='utf-8')

          config_path = Path('config/blog.config.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['site']['name'] = new_brand
          config['site']['baseUrl'] = new_site
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify migration invariants
        run: |
          test -f src/pipeline.mjs
          test -f src/ollama.mjs
          test -f public/index.html
          test -f public/posts/crm.html
          test -f public/assets/brand/hero-banner-2048.avif
          grep -q 'https://airoworking.github.io' config/blog.config.json
          grep -q 'AI로 일하는 법' config/blog.config.json
          ! grep -R --exclude-dir=.git --exclude-dir=.github -n 'https://yunjinyong730.github.io/Profitable-Blog-Automation' .
          ! grep -R --exclude-dir=.git --exclude-dir=.github -n 'https://github.com/yunjinyong730/Profitable-Blog-Automation' .

      - name: Validate migrated repository
        run: |
          node scripts/editorial-polish.mjs
          node scripts/live-overrides.mjs
          node scripts/apply-brand.mjs
          node scripts/test-brand-policy.mjs
          npm run validate

      - name: Commit full migration
        run: |
          git config user.name "blog-migration[bot]"
          git config user.email "blog-migration[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "chore: migrate blog to airoworking.github.io"
          git push origin HEAD:migration/full-site
