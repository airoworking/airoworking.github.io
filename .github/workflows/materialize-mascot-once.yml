name: One-time mascot materialization
on:
  push:
    branches: [feat/mascot-character]
    paths:
      - '.github/workflows/materialize-mascot-once.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mascot-character
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and apply mascot identity
        run: |
          node scripts/editorial-polish.mjs
          node scripts/live-overrides.mjs
          node scripts/apply-brand.mjs
          node scripts/apply-mascot.mjs
          node scripts/apply-mascot.mjs --check
          node scripts/apply-adsense.mjs
          node scripts/apply-adsense.mjs --check
          node scripts/test-brand-policy.mjs
          node scripts/sync-pages-root.mjs
          node scripts/sync-pages-root.mjs --check
      - name: Commit materialized brand files
        run: |
          git config user.name "brand-automation[bot]"
          git config user.email "brand-automation[bot]@users.noreply.github.com"
          git add public .nojekyll .pages-mirror-files.json
          node -e "for (const f of JSON.parse(require('fs').readFileSync('.pages-mirror-files.json','utf8'))) console.log(f)" | while IFS= read -r file; do git add -- "$file"; done
          if git diff --cached --quiet; then
            echo "No materialized changes."
            exit 0
          fi
          git commit -m "chore: materialize mascot brand assets"
          git push origin HEAD:feat/mascot-character
