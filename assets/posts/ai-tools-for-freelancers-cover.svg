<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">프리랜서·1인 사업자가 AI 도구를 실전 활용하는 가이드</title><desc id="d">프리랜서 및 1인 사업자가 AI 도구를 실제 업무에 적용할 때 선택 기준과 실행 단계를 이해하고 실제 활용할 수 있도록 가이드를 제공합니다.</desc><rect width="1200" height="630" rx="32" fill="#0b0b0b"/><circle cx="1040" cy="110" r="190" fill="#202020"/><circle cx="1050" cy="120" r="110" fill="#3a3a3a"/><rect x="72" y="62" width="260" height="48" rx="24" fill="#f5f5f3"/><text x="94" y="94" font-family="system-ui,sans-serif" font-size="22" font-weight="750" fill="#111111">프리랜서·1인 사업자 가이드</text><text font-family="system-ui,sans-serif" font-weight="800" font-size="58" fill="#ffffff"><tspan x="72" y="185">프리랜서·1인 사업자가 AI 도구를 실전 활</tspan><tspan x="72" y="257">용하는 가이드</tspan></text><text font-family="system-ui,sans-serif" font-size="25" fill="#d6d6d3"><tspan x="72" y="430">프리랜서 및 1인 사업자가 AI 도구를 실제 업무에 적용할 때 선택 기준과 </tspan><tspan x="72" y="466">실행 단계를 이해하고 실제 활용할 수 있도록 가이드를 제공합니다.</tspan></text><text x="72" y="575" font-family="system-ui,sans-serif" font-size="22" fill="#a7a7a3">#프리랜서  #1인 사업자  #AI 도구  #실전 활용</text></svg>