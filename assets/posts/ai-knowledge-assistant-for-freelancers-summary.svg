<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t2"><title id="t2">프리랜서·1인 사업자가 AI Knowledge Assistant for Freelancers를 실전 활용하기 위한 가이드 핵심 요약</title><rect width="1200" height="780" rx="28" fill="#f7f7f5"/><text x="60" y="72" font-family="system-ui,sans-serif" font-size="34" font-weight="850" fill="#111111">핵심 요약</text><text x="60" y="112" font-family="system-ui,sans-serif" font-size="19" fill="#666666">본문의 검증된 내용을 빠르게 훑기 위한 자동 생성 인포그래픽</text><rect x="60" y="150" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="174" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="207" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">01</text><text x="158" y="193" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">프리랜서가 AI Knowledge Assistant for</text><text x="158" y="232" font-family="system-ui,sans-serif" font-size="20" fill="#555555">AI 툴의 기능과 사용 용도를 확인하세요.</text><rect x="60" y="300" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="324" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="357" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">02</text><text x="158" y="343" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">AI 툴을 선택할 때 시간과 비용 절감을 위한 기준</text><text x="158" y="382" font-family="system-ui,sans-serif" font-size="20" fill="#555555">AI 툴의 사용 시간과 비용을 고려하세요.</text><rect x="60" y="450" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="474" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="507" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">03</text><text x="158" y="493" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">AI 툴을 선택할 때 가격과 기능을 고려하여 최고의 선택</text><text x="158" y="532" font-family="system-ui,sans-serif" font-size="20" fill="#555555">AI 툴의 기능과 사용 용도를 고려하세요.</text><rect x="60" y="600" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="624" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="657" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">04</text><text x="158" y="643" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">AI Knowledge Assistant for Freel</text><text x="158" y="682" font-family="system-ui,sans-serif" font-size="20" fill="#555555">AI 툴의 기능과 사용 용도를 확인하세요.</text><text x="60" y="748" font-family="system-ui,sans-serif" font-size="16" fill="#8a8a86">AI로 일하는 법 · final fact-checked article</text></svg>