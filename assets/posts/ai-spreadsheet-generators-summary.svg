<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t2"><title id="t2">소규모 사업자가 AI 스프레드시트 생성기 사용 시 선택 기준, 실행 단계, 실제 업무 적용 방법을 이해하고 적용할 수 있는 가이드 핵심 요약</title><rect width="1200" height="780" rx="28" fill="#f7f7f5"/><text x="60" y="72" font-family="system-ui,sans-serif" font-size="34" font-weight="850" fill="#111111">핵심 요약</text><text x="60" y="112" font-family="system-ui,sans-serif" font-size="19" fill="#666666">본문의 검증된 내용을 빠르게 훑기 위한 자동 생성 인포그래픽</text><rect x="60" y="150" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="174" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="207" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">01</text><text x="158" y="193" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">소규모 사업자가 AI 스프레드시트 생성기 선택 시 고려해야</text><text x="158" y="232" font-family="system-ui,sans-serif" font-size="20" fill="#555555">업무 복잡도에 따라 기능의 정확도와 사용 편의성 선택</text><rect x="60" y="300" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="324" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="357" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">02</text><text x="158" y="343" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">AI 스프레드시트 생성기의 실행 단계</text><text x="158" y="382" font-family="system-ui,sans-serif" font-size="20" fill="#555555">데이터 입력 단계: 업무에 필요한 데이터 입력</text><rect x="60" y="450" width="1080" height="120" rx="20" fill="#ffffff" stroke="#d9d9d6"/><rect x="86" y="474" width="48" height="48" rx="14" fill="#111111"/><text x="100" y="507" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">03</text><text x="158" y="493" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#111111">소규모 사업자가 AI 스프레드시트 생성기를 실제 업무에 적</text><text x="