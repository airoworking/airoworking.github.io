<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">AI 스프레드시트 자동화 예제를 실전으로 적용할 수 있는 흐름도</title><desc id="d">데이터에서 자동 처리를 거쳐 검토·보고로 이어지는 업무 흐름</desc><rect width="1200" height="620" rx="28" fill="#f7f7f5"/><rect x="55" y="55" width="1090" height="510" rx="24" fill="#fff" stroke="#d8d8d4"/><text x="92" y="120" font-family="system-ui,sans-serif" font-size="22" font-weight="750" fill="#666">실제 업무 흐름으로 보기</text><text x="92" y="168" font-family="system-ui,sans-serif" font-size="30" font-weight="850" fill="#111">AI 스프레드시트 자동화 예제를 실전으로 적용할 수 있는</text><path d="M310 360H475M725 360H890" stroke="#777" stroke-width="4" stroke-linecap="round"/><path d="m458 348 18 12-18 12M873 348l18 12-18 12" fill="none" stroke="#777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="95" y="270" width="215" height="180" rx="24" fill="#fafaf9" stroke="#cfcfcb"/><text x="202" y="338" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="850" fill="#111">01</text><text x="202" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#111">데이터</text></g><g><rect x="475" y="245" width="250" height="230" rx="28" fill="#111"/><text x="600" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" font-weight="850" fill="#fff">▦</text><text x="600" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="850" fill="#fff">자동 처리</text></g><g><rect x="890" y="270" width="215" height="180" rx="24" fill="#fafaf9" stroke="#cfcfcb"/><text x="997" y="338" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="850" fill="#111">03</text><text x="997" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#111">검토·보고</text></g><text x="92" y="525" font-family="system-ui,sans-serif" font-size="18" fil